<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temperatura Sediul Nou</title>
<style>
  body { margin: 0; padding: 12px; font-family: system-ui, sans-serif; background: #fff; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 1000px; margin: 0 auto; }
  iframe { width: 100%; height: 340px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
  .box { height: 340px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; }
  .box h2 { margin: 0; padding: 12px 10px 12px; position: relative; z-index: 1; background: #fff; text-align: center; font: 600 17px Arial, Helvetica, sans-serif; color: #333; }
  .box iframe { flex: 1; height: auto; border: 0; border-radius: 0; }
  .box:first-child { order: 2; height: auto; }
  .chartwrap { position: relative; overflow: hidden; flex: 1; }
  #chartframe { position: absolute; left: 0; top: 0; width: 520px; max-width: none; height: 330px; border: 0; transform-origin: 0 0; }
  .gaugewrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .gaugewrap svg { width: 100%; max-width: 320px; height: auto; }
  @media (max-width: 700px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="row">
  <div class="box">
    <h2>Grafic Temperatura Sediul Nou</h2>   
    <div class="chartwrap" id="chartwrap"><iframe id="chartframe" scrolling="no" src="https://thingspeak.mathworks.com/channels/2071404/charts/1?bgcolor=%23ffffff&color=%23de1f00&days=7&dynamic=true&title=Temperatura+Sediul+Nou&type=line&xaxis=Timp&yaxis=Temp+%C2%B0C"></iframe></div>
  </div>
  <div class="box">
    <h2>Temperatura Sediul Nou</h2>
    <div class="gaugewrap"><svg id="gauge" viewBox="0 0 200 190"></svg></div>
  </div>
</div>

<script>
  // ---------- SETTINGS ----------
  const CHANNEL_ID = "2071404";
  const FIELD = 1;                 // field the temperature is stored in
  const READ_KEY = "";             // only needed if the channel is private
  const GAUGE_MIN = -10, GAUGE_MAX = 50;
  const REFRESH_SECONDS = 15;      // how often the gauge asks for the latest value
  // ------------------------------

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("gauge");
  const cx = 100, cy = 95, R = 70, START = 225, SWEEP = 270;

  const frac = v => Math.min(1, Math.max(0, (v - GAUGE_MIN) / (GAUGE_MAX - GAUGE_MIN)));
  function pt(f, rad) {
    const a = (START - SWEEP * f) * Math.PI / 180;
    return [cx + rad * Math.cos(a), cy - rad * Math.sin(a)];
  }
  function arc(f0, f1, rad) {
    const [x0, y0] = pt(f0, rad), [x1, y1] = pt(f1, rad);
    const large = (f1 - f0) * SWEEP > 180 ? 1 : 0;
    return `M ${x0} ${y0} A ${rad} ${rad} 0 ${large} 1 ${x1} ${y1}`;
  }
  function add(name, attrs, text) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  }

  // Scale: grey track, colored bands, labels
  add("path", { d: arc(0, 1, R), fill: "none", stroke: "#e5e5e5", "stroke-width": 14 });
  [[-10, 10, "#1e3cff"], [11, 30, "#f2e600"], [31, 50, "#e60000"]].forEach(function (b) {
    add("path", { d: arc(frac(b[0]), frac(b[1]), R), fill: "none", stroke: b[2], "stroke-width": 8 });
  });
  for (let v = GAUGE_MIN; v <= GAUGE_MAX; v += 10) {
    const [x, y] = pt(frac(v), R - 16);
    add("text", { x: x, y: y + 3, "text-anchor": "middle", "font-size": 9, fill: "#333" }, v);
  }

  // Needle, hub and value text
  const needle = add("line", { x1: cx, y1: cy, x2: cx, y2: cy, stroke: "#000000", "stroke-width": 3, "stroke-linecap": "round" });
  add("circle", { cx: cx, cy: cy, r: 5, fill: "#000000" });
  const valueText = add("text", { x: cx, y: 172, "text-anchor": "middle", "font-size": 24, "font-weight": 600, fill: "#222" }, "--");

  function setValue(v) {
    const [x, y] = pt(frac(v), R - 8);
    needle.setAttribute("x2", x);
    needle.setAttribute("y2", y);
    valueText.textContent = v.toFixed(1) + " °C";
  }

  // Fetch the latest value without reloading anything (the gauge never resets)
  async function load() {
    try {
      let url = "https://api.thingspeak.com/channels/" + CHANNEL_ID + "/feeds/last.json?_=" + Date.now();
      if (READ_KEY) url += "&api_key=" + READ_KEY;
      const res = await fetch(url);
      if (!res.ok) return;                       // keep showing the last value
      const json = await res.json();
      const v = parseFloat(json["field" + FIELD]);
      if (!isNaN(v)) setValue(v);
    } catch (e) { /* keep showing the last value */ }
  }

  load();
  setInterval(load, REFRESH_SECONDS * 1000);

 // Scale the chart frame so it fits the width and magnifies text/grid lines
  const CHART_W = 420, CHART_H = 330, CHART_CROP = 26;   // Lower CHART_W zooms in on chart elements
  function fitChart() {
    const wrap = document.getElementById("chartwrap");
    const frame = document.getElementById("chartframe");
    const k = wrap.clientWidth / CHART_W;
    frame.style.transform = "scale(" + k + ") translateY(-" + CHART_CROP + "px)";
    wrap.style.minHeight = Math.round((CHART_H - CHART_CROP) * k) + "px";
  }
  fitChart();
  window.addEventListener("resize", fitChart);
</script>
</body>
</html>
